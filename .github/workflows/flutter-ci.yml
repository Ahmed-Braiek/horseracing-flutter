name: CAVALEA Flutter
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
concurrency:
  group: cavalea-${{ github.ref }}
  cancel-in-progress: true
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter create --platforms=android,windows,web --project-name cavalea .
      - run: flutter pub get
      - run: rm -f test/widget_test.dart
      - run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - run: flutter test
      - run: dart run sqflite_common_ffi_web:setup
      - run: flutter build web
      - run: flutter build apk --debug
      - uses: actions/upload-artifact@v4
        with:
          name: cavalea-android-debug
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
